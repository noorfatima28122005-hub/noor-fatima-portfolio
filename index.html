<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noor Fatima | To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background-grid"></div>


    <!-- Main App -->
    <main class="app-container">

        <!-- Header -->
        <header class="app-header">

            <div class="status">
                <span></span>
                PRODUCTIVITY APP
            </div>

            <h1>
                My <span>Tasks</span>
            </h1>

            <p>
                Organize your day. Stay focused. Get things done.
            </p>

        </header>


        <!-- To-Do Card -->
        <section class="todo-card">

            <!-- Add Task -->
            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                >

                <button id="addTaskBtn">
                    + Add Task
                </button>

            </div>


            <!-- Task Information -->
            <div class="task-info">

                <span id="taskCount">
                    0 Tasks
                </span>

                <button id="clearCompleted">
                    Clear Completed
                </button>

            </div>


            <!-- Tasks -->
            <div
                class="tasks-list"
                id="tasksList"
            >

                <!-- Empty State -->
                <div
                    class="empty-state"
                    id="emptyState"
                >

                    <div class="empty-icon">
                        ✓
                    </div>

                    <h2>
                        No tasks yet
                    </h2>

                    <p>
                        Add your first task and start being productive.
                    </p>

                </div>

            </div>

        </section>


        <!-- Back Button -->
        <a
            href="#"
            class="back-link"
            onclick="history.back(); return false;"
        >
            ← Back to Portfolio
        </a>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
