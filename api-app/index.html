<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Noor Fatima - API Based Web Application"
    >

    <title>API Based Web App | Noor Fatima</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-grid"></div>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="../index.html" class="logo">
            NOOR<span>.</span>
        </a>

        <a href="../index.html" class="back-link">
            ← Back to Portfolio
        </a>

    </header>


    <!-- MAIN -->
    <main>

        <section class="app-section">

            <div class="app-container">

                <p class="section-label">
                    JAVASCRIPT • API • JSON
                </p>

                <h1>
                    API Based <span>Web App</span>
                </h1>

                <p class="description">
                    Search for a country and view information
                    fetched from a public API.
                </p>


                <!-- SEARCH -->
                <div class="search-box">

                    <input
                        type="text"
                        id="countryInput"
                        placeholder="Enter country name..."
                        autocomplete="off"
                    >

                    <button
                        id="searchButton"
                        type="button"
                    >
                        Search
                    </button>

                </div>


                <!-- MESSAGE -->
                <p id="message"></p>


                <!-- COUNTRY CARD -->
                <div
                    id="countryCard"
                    class="country-card"
                >

                    <div class="country-flag">
                        🌍
                    </div>

                    <h2>
                        Search a country
                    </h2>

                    <div class="country-info">

                        <p>
                            <strong>CAPITAL</strong>
                            <span id="capital">—</span>
                        </p>

                        <p>
                            <strong>REGION</strong>
                            <span id="region">—</span>
                        </p>

                        <p>
                            <strong>POPULATION</strong>
                            <span id="population">—</span>
                        </p>

                        <p>
                            <strong>CURRENCY</strong>
                            <span id="currency">—</span>
                        </p>

                        <p>
                            <strong>LANGUAGE</strong>
                            <span id="language">—</span>
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            NOOR<span>.</span>
        </div>

        <p>
            API Based Web Application
        </p>

        <small>
            © 2026 Noor Fatima
        </small>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
